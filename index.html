<body><a class="skip" href="#main">Zum Lerninhalt</a><header class="wrap bar"><a class="brand" href="#" id="home"><span class="icon" aria-hidden="true">∪</span><span><strong>PARABEL-OBSERVATORIUM</strong><small>MATHEMATIK 9C · AUFGABEN</small></span></a><div class="actions"><button id="worksheet">Arbeitsblatt</button><button id="teacher" class="quiet">Lehrkraft</button></div></header><div class="wrap warning" id="storage-warning" hidden>Dein Fortschritt kann in diesem Browser nicht gespeichert werden. Lass die Datei geöffnet und drucke am Ende dein Lernprotokoll.</div><main class="wrap" id="main" tabindex="-1"></main><noscript><p class="wrap warning">Bitte aktiviere JavaScript, damit die Aufgaben und Rückmeldungen angezeigt werden.</p></noscript><footer class="wrap footer"><span>Offline nutzbar · Vier Lernstationen · Dein Fortschritt bleibt auf diesem Gerät.</span><div class="actions"><button class="quiet" id="save-report">Lernprotokoll</button><button class="quiet" id="reset">Neu beginnen</button></div></footer><dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="Dialog schließen">×</button></div><div id="dialog-body" class="dialog-body"></div></dialog><div id="print-root" class="print-only"></div><script id="lesson-data" type="application/json">{"title":"Das Parabel-Observatorium","chapters":[{"id":"funktion","title":"Quadratische Funktionen","short":"Die Formelkammer","symbol":"x²","goal":"Erkenne quadratische Funktionen und bestimme a, b und c.","reward":"Formelkarte","color":"#8edbd1","tasks":[{"id":"f1","type":"choice","question":"Welche Funktion ist quadratisch?","options":["f(x) = 3x + 2","g(x) = −2x² + 5","h(x) = x³ + x²"],"answer":1,"hint":"Die höchste vorkommende Potenz von x muss x² sein.","solution":"g ist quadratisch: a = −2 ≠ 0. f ist linear; bei h kommt x³ vor."},{"id":"f2","type":"numbers","question":"Bestimme a, b und c für f(x) = 2x² − 5x + 4.","fields":["a","b","c"],"answer":[2,-5,4],"hint":"Lies einschließlich der Vorzeichen ab: Faktor vor x², Faktor vor x, Zahl ohne x.","solution":"a = 2, b = −5, c = 4."},{"id":"f3","type":"numbers","question":"Bestimme a, b und c für g(x) = 7 − x².","fields":["a","b","c"],"answer":[-1,0,7],"hint":"Ordne um: −x² + 0x + 7. Vor x² steht der nicht ausgeschriebene Faktor −1.","solution":"a = −1, b = 0, c = 7."},{"id":"f4","type":"numbers","question":"Bestimme a, b und c für h(x) = 0,5x² − 3x.","fields":["a","b","c"],"answer":[0.5,-3,0],"hint":"Die Zahl ohne x fehlt. Ihr Koeffizient ist 0.","solution":"a = 0,5, b = −3, c = 0."},{"id":"f5","type":"choice","question":"Warum gehört f(x) = 0x² + 4x − 1 nicht zu den quadratischen Funktionen?","options":["Weil b nicht null ist.","Weil c negativ ist.","Weil a = 0 ist und deshalb der x²-Term wegfällt."],"answer":2,"hint":"Vereinfache zuerst 0x².","solution":"Der x²-Term fällt weg. Es bleibt die lineare Funktion f(x) = 4x − 1."}]},{"id":"parabel","title":"Parabel und Scheitelpunkt","short":"Die Graphengalerie","symbol":"∪","goal":"Benenne Parabeln und lies ihren höchsten oder tiefsten Punkt ab.","reward":"Scheitelkompass","color":"#eec482","tasks":[{"id":"p1","type":"choice","question":"Wie nennt man den Graphen einer quadratischen Funktion?","options":["Gerade","Parabel","Scheitelpunkt"],"answer":1,"hint":"Der Scheitelpunkt ist nur ein einzelner Punkt des Graphen.","solution":"Der gesamte Graph heißt Parabel."},{"id":"p2","type":"numbers","graph":"up","question":"Lies den Scheitelpunkt der abgebildeten Parabel ab.","fields":["x-Koordinate von S","y-Koordinate von S"],"answer":[1,-2],"hint":"Suche den tiefsten Punkt. Lies zuerst waagerecht die x-Koordinate und dann senkrecht die y-Koordinate ab.","solution":"S(1 | −2). Die Parabel ist nach oben geöffnet."},{"id":"p3","type":"numbers","graph":"down","question":"Lies den Scheitelpunkt dieser Parabel ab.","fields":["x-Koordinate von S","y-Koordinate von S"],"answer":[-1,3],"hint":"Diese Parabel ist nach unten geöffnet. Suche ihren höchsten Punkt.","solution":"S(−1 | 3). Der Scheitelpunkt ist hier der höchste Punkt."},{"id":"p4","type":"choice","question":"Eine Parabel ist nach unten geöffnet. Welche Aussage stimmt?","options":["Ihr Scheitelpunkt ist ihr tiefster Punkt.","Ihr Scheitelpunkt liegt immer im Ursprung.","Ihr Scheitelpunkt ist ihr höchster Punkt."],"answer":2,"hint":"Stelle dir einen Bogen vor, dessen beide Äste nach unten verlaufen.","solution":"Bei einer nach unten geöffneten Parabel ist der Scheitelpunkt der höchste Punkt."}]},{"id":"gleichung","title":"Quadratische Gleichungen","short":"Das Gleichungsarchiv","symbol":"= 0","goal":"Erkenne die Form ax² + bx + c = 0 und unterscheide sie von einer Funktion.","reward":"Gleichungssiegel","color":"#b7b5ef","tasks":[{"id":"g1","type":"choice","question":"Welche Gleichung ist quadratisch?","options":["3x + 7 = 0","x³ − 2 = 0","−2x² + 3x = 0"],"answer":2,"hint":"Gesucht ist eine Gleichung mit höchster Potenz x² und einem von null verschiedenen Faktor davor.","solution":"−2x² + 3x = 0 ist quadratisch: a = −2, b = 3, c = 0."},{"id":"g2","type":"choice","question":"Gegeben ist f(x) = 3x² − 2x − 6. Welche Gleichung entsteht durch f(x) = 0?","options":["3x² − 2x − 6 = 0","3x² − 2x = 0","3x² − 2x − 6 = x"],"answer":0,"hint":"Übernimm den ganzen Funktionsterm unverändert und setze ihn gleich 0.","solution":"3x² − 2x − 6 = 0. Der gesamte Term bleibt erhalten."},{"id":"g3","type":"numbers","question":"Bestimme a, b und c in der quadratischen Gleichung −x² + 8 = 0.","fields":["a","b","c"],"answer":[-1,0,8],"hint":"Schreibe gedanklich −1x² + 0x + 8 = 0.","solution":"a = −1, b = 0, c = 8. Lösungen sind hier nicht gefragt."}]},{"id":"normal","title":"Die Normalparabel","short":"Die Zeichenkuppel","symbol":"S","goal":"Berechne Werte von f(x) = x² und erkenne die Normalparabel.","reward":"Sternenkarte","color":"#b8d99b","tasks":[{"id":"n1","type":"numbers","question":"Ergänze für f(x) = x² die drei fehlenden Funktionswerte.","fields":["f(−3)","f(0)","f(2)"],"answer":[9,0,4],"hint":"Quadriere jede eingesetzte Zahl. (−3)² = (−3) · (−3).","solution":"f(−3) = 9, f(0) = 0, f(2) = 4."},{"id":"n2","type":"numbers","question":"Berechne f(−0,5) für die Normalparabel.","fields":["f(−0,5)"],"answer":[0.25],"hint":"(−0,5)² = (−0,5) · (−0,5). Zwei negative Faktoren ergeben ein positives Produkt.","solution":"f(−0,5) = 0,25."},{"id":"n3","type":"choice","question":"Welcher Punkt liegt auf der Normalparabel?","options":["P(−2 | −4)","Q(−2 | 4)","R(2 | 2)"],"answer":1,"hint":"Ein Punkt (x | y) liegt auf diesem Graphen, wenn y = x² gilt.","solution":"Q(−2 | 4), denn (−2)² = 4."},{"id":"n4","type":"numbers","question":"Gib die Koordinaten des Scheitelpunkts der Normalparabel an.","fields":["x-Koordinate von S","y-Koordinate von S"],"answer":[0,0],"hint":"Der kleinste Wert von x² ist 0. Bei welchem x wird er erreicht?","solution":"S(0 | 0)."},{"id":"n5","type":"choice","question":"Welche Aussage über die Normalparabel stimmt?","options":["Sie ist symmetrisch zur x-Achse.","Ihr höchster Punkt liegt bei (0 | 0).","Sie ist zur y-Achse symmetrisch und hat keine negativen Funktionswerte."],"answer":2,"hint":"Vergleiche f(−2) und f(2). Betrachte auch den tiefsten Punkt.","solution":"Die Normalparabel ist symmetrisch zur y-Achse; alle Funktionswerte sind ≥ 0."}]}],"final":[{"id":"z1","type":"numbers","question":"Bestimme a, b und c für f(x) = 5 − 2x + x².","fields":["a","b","c"],"answer":[1,-2,5],"hint":"Ordne nach x², x und der Zahl ohne x.","solution":"f(x) = x² − 2x + 5: a = 1, b = −2, c = 5."},{"id":"z2","type":"numbers","graph":"final","question":"Lies den Scheitelpunkt der Parabel ab.","fields":["x-Koordinate von S","y-Koordinate von S"],"answer":[2,1],"hint":"Suche den tiefsten Punkt und lies beide Koordinaten ab.","solution":"S(2 | 1)."},{"id":"z3","type":"choice","question":"Welche Gleichung entsteht, wenn man den Term von g(x) = −3x² + 2 gleich 0 setzt?","options":["−3x² + 2 = 0","−3x² = 0","−3x + 2 = 0"],"answer":0,"hint":"Übernimm den vollständigen Term mit x².","solution":"−3x² + 2 = 0."},{"id":"z4","type":"choice","question":"Welcher Funktionsterm gehört zur Normalparabel?","options":["f(x) = 2x²","f(x) = x² + 1","f(x) = x²"],"answer":2,"hint":"Bei der Normalparabel ist a = 1 und b = c = 0.","solution":"Die Normalparabel ist der Graph von f(x) = x²."}]}</script><script>'use strict';
const LESSON=JSON.parse(document.getElementById('lesson-data').textContent);
const STORE='parabel-observatorium-v1',chapters=LESSON.chapters,allTasks=[...chapters.flatMap(c=>c.tasks),...LESSON.final];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const math=s=>`<span class="math">${esc(s).replaceAll('²','<sup>2</sup>').replaceAll('³','<sup>3</sup>')}</span>`;
const fmt=n=>String(Object.is(n,-0)?0:n).replace('.',',').replace('-','−');
const fresh=()=>({version:1,started:false,view:'intro',solved:[],drafts:{},notes:'',reflection:'',confidence:''});
function restore(raw){const s=fresh();if(!raw||raw.version!==1)return s;s.started=raw.started===true;s.solved=Array.isArray(raw.solved)?[...new Set(raw.solved.filter(id=>allTasks.some(t=>t.id===id)))]:[];s.view=['intro','map','final',...chapters.map(c=>c.id)].includes(raw.view)?raw.view:'map';for(const key of ['notes','reflection','confidence'])s[key]=String(raw[key]||'').slice(0,6000);for(const t of allTasks){const v=raw.drafts?.[t.id];if(t.type==='choice'&&Number.isInteger(v)&&v>=0&&v<t.options.length)s.drafts[t.id]=v;else if(t.type==='numbers'&&Array.isArray(v))s.drafts[t.id]=t.fields.map((_,i)=>String(v[i]??'').slice(0,50));}return s;}
let state=fresh(),storageOK=true;
try{state=restore(JSON.parse(localStorage.getItem(STORE)||'null'));}catch{storageOK=false;}
const done=c=>c.tasks.every(t=>state.solved.includes(t.id)),unlocked=i=>i===0||chapters.slice(0,i).every(done),allDone=()=>chapters.every(done),finished=()=>allDone()&&LESSON.final.every(t=>state.solved.includes(t.id));
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch{storageOK=false;}$('#storage-warning').hidden=storageOK;}
function parseNumber(raw){let s=String(raw).trim().replaceAll('−','-').replace(',','.');if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:\s*\/\s*[+-]?(?:\d+(?:\.\d*)?|\.\d+))?$/.test(s))return null;const p=s.split('/').map(Number),n=p.length===2?p[0]/p[1]:p[0];return Number.isFinite(n)?n:null;}
function checkAnswer(t,v){return t.type==='choice'?v===t.answer:Array.isArray(v)&&v.length===t.answer.length&&v.every((x,i)=>parseNumber(x)!==null&&Math.abs(parseNumber(x)-t.answer[i])<1e-9);}
function dialog(title,body){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;$('#dialog').showModal();}
function art(n=0){return `<svg viewBox="0 0 600 340" role="img" aria-label="Ein Observatorium mit vier beleuchteten Lernräumen"><defs><linearGradient id="sky-${n}" x2="0" y2="1"><stop stop-color="#183b49"/><stop offset="1" stop-color="#081821"/></linearGradient></defs><rect x="0" y="0" width="600" height="340" rx="14" fill="url(#sky-${n})"/>${[[45,54],[140,30],[488,48],[552,98],[350,25],[530,210]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2" fill="#dfe5d5"/>`).join('')}<path d="M32 293L130 260L217 286L377 257L570 297V340H32Z" fill="#07141c"/><path d="M192 146A108 108 0 0 1 216 78Q300 4 384 78A108 108 0 0 1 408 146" fill="#264956" stroke="#8edbd1" stroke-width="2"/><path d="M300 42V145M228 71Q300 130 372 71" fill="none" stroke="#43626a" stroke-width="2"/><rect x="147" y="143" width="306" height="154" fill="#142e3a" stroke="#4b6a74" stroke-width="2"/><rect x="133" y="143" width="334" height="14" fill="#365363"/><path d="M165 292H437M165 229H437" stroke="#3d5a64"/>${chapters.map((c,i)=>{let x=166+i*72;return `<rect x="${x}" y="178" width="53" height="91" rx="25" fill="${n===i+1?'#315c5a':'#0c202c'}" stroke="${c.color}" stroke-width="2"/><text x="${x+26}" y="214" text-anchor="middle" fill="${c.color}" font-size="21" font-family="Georgia">${esc(c.symbol)}</text><text x="${x+26}" y="248" text-anchor="middle" fill="#bfd0d4" font-size="13">0${i+1}</text>`}).join('')}<path d="M269 298L239 337H361L331 298" fill="#34464a"/><path d="M64 281Q93 174 123 281M478 270Q508 173 538 270" fill="none" stroke="#8edbd1" stroke-width="3"/><circle cx="93" cy="227" r="5" fill="#edc482"/><circle cx="508" cy="221" r="5" fill="#edc482"/></svg>`;}
const graphs={up:{a:1,b:-2,c:-1,sx:1,sy:-2},down:{a:-.5,b:-1,c:2.5,sx:-1,sy:3},final:{a:.5,b:-2,c:3,sx:2,sy:1}};
function graph(kind,{print=false}={}){const g=graphs[kind],W=560,H=500,unit=55,x0=280,y0=305,xmin=-4,xmax=4,ymin=-3,ymax=5,X=x=>x0+x*unit,Y=y=>y0-y*unit,ink=print?'#19323d':'#bdcfd7',grid=print?'#dbe1e3':'#29434e',curve=print?'#12665f':'#8edbd1',gold=print?'#9a4f0a':'#edc482';let out=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Koordinatensystem mit ${g.a>0?'nach oben':'nach unten'} geöffneter Parabel"><defs><clipPath id="clip-${kind}-${print}"><rect x="${X(xmin)}" y="${Y(ymax)}" width="${(xmax-xmin)*unit}" height="${(ymax-ymin)*unit}"/></clipPath></defs>`;
for(let x=xmin;x<=xmax;x++){out+=`<path d="M${X(x)} ${Y(ymin)}V${Y(ymax)}" stroke="${grid}"/>`;if(x&&x>xmin&&x<xmax)out+=`<text x="${X(x)}" y="${Y(0)+23}" text-anchor="middle" fill="${ink}" font-size="19">${fmt(x)}</text>`;}
for(let y=ymin;y<=ymax;y++){out+=`<path d="M${X(xmin)} ${Y(y)}H${X(xmax)}" stroke="${grid}"/>`;if(y&&y>ymin&&y<ymax)out+=`<text x="${X(0)-12}" y="${Y(y)+6}" text-anchor="end" fill="${ink}" font-size="19">${fmt(y)}</text>`;}
out+=`<path d="M${X(xmin)} ${Y(0)}H${X(xmax)}m-10 -5l10 5l-10 5M${X(0)} ${Y(ymin)}V${Y(ymax)}m-5 10l5 -10l5 10" stroke="${ink}" fill="none" stroke-width="1.8"/><text x="${X(xmax)-9}" y="${Y(0)-13}" fill="${ink}" font-size="21">x</text><text x="${X(0)+12}" y="${Y(ymax)+15}" fill="${ink}" font-size="21">y</text><text x="${X(0)-15}" y="${Y(0)+22}" fill="${ink}" font-size="17">0</text>`;
let path='';for(let i=0;i<=500;i++){const x=xmin+(xmax-xmin)*i/500,y=g.a*x*x+g.b*x+g.c;path+=(i?'L':'M')+X(x).toFixed(2)+' '+Y(y).toFixed(2);}
out+=`<path d="${path}" fill="none" stroke="${curve}" stroke-width="3.6" clip-path="url(#clip-${kind}-${print})"/><circle cx="${X(g.sx)}" cy="${Y(g.sy)}" r="5.5" fill="${gold}"/>`;
return out+'</svg>';}
function progress(){return `<div class="progress"><small>${state.solved.length} von ${allTasks.length} Aufgaben geprüft</small><progress max="${allTasks.length}" value="${state.solved.length}" aria-label="Lernfortschritt"></progress></div>`;}
function intro(){return `<section class="hero"><div><p class="eyebrow">DEINE NÄCHSTE MISSION / QUADRATISCHE FUNKTIONEN</p><h1>Neue Kurven.<br><em>Neue Begriffe.</em></h1><p class="lead">Im Parabel-Observatorium warten vier Lernräume auf dich. Bearbeite Aufgaben zu Funktionstermen, Parabeln und Gleichungen und vervollständige deine Sternenkarte.</p><div class="tags"><span class="tag">4 Aufgabenräume</span><span class="tag">Mit Hinweisen</span><span class="tag">${allTasks.length} Aufgaben mit Rückmeldung</span></div><div class="actions"><button class="primary" data-go="map">${state.started?'Mission fortsetzen':'Observatorium betreten'} →</button></div><p class="small" style="margin-top:17px">Lege Papier und Stift bereit. Bearbeite die Aufgaben im Anschluss an die Erklärung im Unterricht. Es gibt keinen Zeitdruck.</p></div><div class="art"><div class="art-caption"><span>OBSERVATORIUM / 9C</span><span>VIER RÄUME</span></div>${art()}<div class="art-caption"><span>FUNKTION · PARABEL · GLEICHUNG</span><span>MISSION 02</span></div></div></section><section class="briefing"><article><p class="eyebrow">01 / AUFGABEN LÖSEN</p><h3>Das Gelernte anwenden</h3><p>Bestimme Koeffizienten, lies Scheitelpunkte ab und arbeite mit quadratischen Gleichungen und der Normalparabel.</p></article><article><p class="eyebrow">02 / SELBST PRÜFEN</p><h3>Jeder Gedanke zählt</h3><p>Du erhältst Rückmeldungen und bei Bedarf einen Hinweis. Nach allen Aufgaben eines Raums öffnet sich der nächste.</p></article><article><p class="eyebrow">03 / GEMEINSAM BESPRECHEN</p><h3>Mit Fragen weiterlernen</h3><p>Halte offene Fragen im Lernprotokoll fest. Auf dem Arbeitsblatt findest du weitere Aufgaben für den Unterricht.</p></article></section>`;}
function map(){return `<div class="heading"><div><p class="eyebrow">DEIN STATIONSPLAN</p><h1>Vier Räume bis zur Sternenkarte.</h1></div>${progress()}</div><p class="muted">Beginne in der Formelkammer. Löse die Aufgaben eines Raums, um den nächsten Raum zu öffnen.</p><div class="cards">${chapters.map((c,i)=>`<article class="roomcard">${art(i+1)}<div><p class="eyebrow">RAUM 0${i+1} / ${c.title.toUpperCase()}</p><h2>${c.short}</h2><p>${c.goal}</p><div class="actions"><button ${unlocked(i)?'':'disabled'} data-go="${c.id}" class="${unlocked(i)?'primary':''}">${done(c)?'Noch einmal ansehen':unlocked(i)?'Raum betreten →':'Vorigen Raum abschließen'}</button><span class="status">${done(c)?'✓ '+c.reward:c.tasks.filter(t=>state.solved.includes(t.id)).length+' / '+c.tasks.length+' Aufgaben'}</span></div></div></article>`).join('')}</div><div class="panel completion-link"><h2>Die letzte Beobachtung</h2><p class="muted">Vier neue Abschlussfragen zeigen dir, ob du die Begriffe sicher unterscheiden kannst.</p><button class="mint" data-go="final" ${allDone()?'':'disabled'}>Zum Abschlusscheck →</button></div>`;}
function side(){return `<aside class="side"><h3>Dein Weg</h3><nav aria-label="Lernstationen"><button data-go="map">⌂ Stationsplan</button>${chapters.map((c,i)=>`<button data-go="${c.id}" ${unlocked(i)?'':'disabled'} ${state.view===c.id?'aria-current="step"':''}>0${i+1} · ${c.title}${done(c)?' ✓':''}</button>`).join('')}<button data-go="final" ${allDone()?'':'disabled'} ${state.view==='final'?'aria-current="step"':''}>Abschlusscheck</button></nav><div class="inventory"><h3>Deine Fundstücke</h3>${chapters.filter(done).map(c=>`<div>✓ ${c.reward}</div>`).join('')||'<p>Dein erstes Fundstück wartet in der Formelkammer.</p>'}</div></aside>`;}
function taskHTML(t){const solved=state.solved.includes(t.id),v=state.drafts[t.id];return `<form class="task ${solved?'solved':''}" id="task-${t.id}" data-task="${t.id}"><p class="task-title">AUFTRAG ${t.id.toUpperCase()} ${solved?'· ✓ GEPRÜFT':''}</p><h3 id="label-${t.id}">${math(t.question)}</h3>${t.graph?`<div class="graph">${graph(t.graph)}</div>`:''}${t.type==='choice'?`<fieldset class="options" aria-labelledby="label-${t.id}" ${solved?'disabled':''}>${t.options.map((o,i)=>`<label class="option"><input type="radio" name="${t.id}" value="${i}" ${v===i?'checked':''}><span>${math(o)}</span></label>`).join('')}</fieldset>`:`<div class="fields">${t.fields.map((f,i)=>`<label for="answer-${t.id}-${i}">${math(f)}<input id="answer-${t.id}-${i}" name="value-${i}" autocomplete="off" inputmode="text" maxlength="50" value="${esc(v?.[i]??'')}" ${solved?'disabled':''}></label>`).join('')}</div>`}<div class="actions"><button class="${solved?'quiet':'mint'}" ${solved?'disabled':''}>${solved?'✓ Richtig':'Antwort prüfen'}</button></div><p class="feedback" role="status" aria-live="polite">${solved?math(t.solution):''}</p><details class="hint"><summary>Ein Hinweis</summary><p>${math(t.hint)}</p></details></form>`;}
function room(c){const i=chapters.indexOf(c);return `<div class="heading"><div><p class="eyebrow">RAUM 0${i+1} / ${c.short.toUpperCase()}</p><h1>${c.title}</h1></div>${progress()}</div><div class="layout"><div><section class="panel"><p class="note"><b>Dein Ziel:</b> ${c.goal}</p><h2>Deine Aufgaben</h2><p class="small">Notiere deinen Rechenweg auf Papier. Komma und Dezimalpunkt werden akzeptiert; auch einfache Brüche wie 1/2 sind möglich.</p>${c.tasks.map(taskHTML).join('')}<div class="unlock" id="unlock">${unlockHTML(c)}</div></section></div>${side()}</div>`;}
function unlockHTML(c){const i=chapters.indexOf(c);return done(c)?`<h3>✓ ${c.reward} gefunden</h3><p>Die Aufgaben dieses Raums sind geprüft. Du kannst deine Antworten und die Rückmeldungen jederzeit erneut ansehen.</p><button class="primary" data-go="${i===3?'final':chapters[i+1].id}">${i===3?'Zum Abschlusscheck':'Zum nächsten Raum'} →</button>`:`<p>Noch ${c.tasks.filter(t=>!state.solved.includes(t.id)).length} ${c.tasks.filter(t=>!state.solved.includes(t.id)).length===1?'Aufgabe':'Aufgaben'} bis zum Fundstück. Nutze bei Bedarf die Hinweise.</p><button disabled>Nächsten Raum freischalten</button>`;}
function final(){return `<div class="heading"><div><p class="eyebrow">DEINE LETZTE BEOBACHTUNG</p><h1>Passt alles zusammen?</h1></div>${progress()}</div><div class="layout"><div><section class="panel"><h2>Vier Fragen ohne neue Begriffe</h2><p class="muted">Bearbeite diese Fragen möglichst zuerst ohne Hilfe. Du darfst anschließend in die Räume zurückkehren.</p>${LESSON.final.map(taskHTML).join('')}</section><section id="completion">${completion()}</section><section class="panel"><h2>Dein Rückblick</h2><label for="reflection"><b>Erkläre mit eigenen Worten:</b> Was ist der Unterschied zwischen einer quadratischen Funktion, ihrer Parabel und einer quadratischen Gleichung?</label><textarea id="reflection" placeholder="Eine quadratische Funktion … Ihr Graph … Eine quadratische Gleichung …">${esc(state.reflection)}</textarea><label for="notes"><b>Was möchtest du noch klären?</b></label><textarea id="notes" placeholder="Meine offene Frage …">${esc(state.notes)}</textarea><label for="confidence">Wie sicher fühlst du dich?</label><select id="confidence"><option value="">Bitte auswählen</option>${['Ich brauche noch Unterstützung.','Vieles klappt; einzelne Fragen sind offen.','Ich kann die Begriffe erklären.'].map(v=>`<option ${state.confidence===v?'selected':''}>${v}</option>`).join('')}</select><p class="save-note">Deine Angaben werden lokal gespeichert. Niemand erhält sie automatisch.</p><div class="actions"><button class="primary" data-action="report">Lernprotokoll drucken / als PDF speichern</button><button data-action="worksheet">Arbeitsblatt für die Stunde</button></div></section></div>${side()}</div>`;}
function completion(){return finished()?`<div class="success"><p class="eyebrow">STERNENKARTE VOLLSTÄNDIG</p><h2>Du hast das Observatorium erschlossen.</h2><p>Alle ${allTasks.length} Aufgaben sind geprüft. Halte jetzt deine eigene Erklärung und eine offene Frage für das Unterrichtsgespräch fest.</p></div>`:`<p class="note">Die Sternenkarte wird vollständig, wenn du alle vier Abschlussfragen richtig beantwortet hast.</p>`;}
function render(){const ci=chapters.findIndex(c=>c.id===state.view);if(ci>=0&&!unlocked(ci))state.view='map';if(state.view==='final'&&!allDone())state.view='map';$('#main').innerHTML=state.view==='intro'?intro():state.view==='map'?map():state.view==='final'?final():room(chapters.find(c=>c.id===state.view));save();}
function navigate(view){if(view!=='intro')state.started=true;state.view=view;render();window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true});}
function readTask(t,form){return t.type==='choice'?(form.querySelector('input:checked')?Number(form.querySelector('input:checked').value):null):t.fields.map((_,i)=>form.querySelector(`[name="value-${i}"]`).value);}
function printDocument(body){$('#print-root').innerHTML=body;window.print();}
function worksheet(){printDocument(`<section class="print-page"><p>PARABEL-OBSERVATORIUM · MATHEMATIK 9C</p><h1>Vom Term zum Graphen</h1><p>Name: ____________________________ Datum: ______________</p><h2>1 · Erkennen und begründen</h2><p>Welche Funktionen sind quadratisch? Begründe kurz.</p><p>${math('f(x) = −3x² + 2   ·   g(x) = 4x − 1   ·   h(x) = 5 − x²')}</p><div class="write-lines short"></div><h2>2 · Koeffizienten ablesen</h2><p>Bestimme a, b und c. Ordne den Term bei Bedarf um.</p><table><tr><th>Funktionsterm</th><th>a</th><th>b</th><th>c</th></tr>${['2x² − 4x + 7','6 − x²','0,5x² + 3x','2 − 5x + x²'].map(t=>`<tr><td>${math(t)}</td><td>______</td><td>______</td><td>______</td></tr>`).join('')}</table><h2>3 · Selbst einen Term aufschreiben</h2><p>a = −2, b = 3, c = 0. Gib die Funktion in der Form ${math('f(x) = ax² + bx + c')} an.</p><div class="write-lines short"></div><h2>4 · Eine Gleichung aufstellen</h2><p>Gegeben ist ${math('g(x) = 2x² + x − 6')}. Schreibe die Gleichung auf, die durch ${math('g(x) = 0')} entsteht. Berechne keine Lösungen.</p><div class="write-lines short"></div><p><b>Erkläre:</b> Was ist bei der Funktion anders als bei dieser Gleichung?</p><div class="write-lines"></div><p class="muted">Eigene Übungsaufgaben; keine Lösungsverfahren erforderlich. Seite 1 / 2</p></section><section class="print-page"><p>PARABEL-OBSERVATORIUM · MATHEMATIK 9C</p><h1>Parabeln untersuchen</h1><h2>5 · Scheitelpunkte ablesen</h2><p>Notiere jeweils den Scheitelpunkt und entscheide: höchster oder tiefster Punkt?</p><div class="print-graphs"><div><b>Parabel A</b>${graph('up',{print:true})}<p>S(____ | ____) · __________________</p></div><div><b>Parabel B</b>${graph('down',{print:true})}<p>S(____ | ____) · __________________</p></div></div><h2>6 · Die Normalparabel</h2><p>Ergänze die Wertetabelle für ${math('f(x) = x²')}. Zeichne die Normalparabel auf kariertem Papier durch diese Punkte. Verwende auf beiden Achsen denselben Maßstab.</p><table><tr><th>x</th>${[-3,-2,-1,0,1,2,3].map(x=>`<td>${fmt(x)}</td>`).join('')}</tr><tr><th>f(x)</th>${Array(7).fill('<td>____</td>').join('')}</tr></table><h2>7 · Einen Fehler verbessern</h2><p>Jemand schreibt: ${math('f(−2) = −4')} für ${math('f(x) = x²')}. Berichtige die Rechnung und erkläre den Fehler.</p><div class="write-lines short"></div><h2>8 · Begriffe verbinden</h2><p>Erkläre die Wörter <b>quadratische Funktion</b>, <b>Parabel</b>, <b>Scheitelpunkt</b> und <b>Normalparabel</b> mit eigenen Worten.</p><div class="write-lines"></div><p class="muted">Meine offene Frage: ___________________________________________________ · Seite 2 / 2</p></section>`);}
function report(){printDocument(`<section class="print-page"><p>PARABEL-OBSERVATORIUM · MEINE AUFGABEN</p><h1>Mein Lernprotokoll</h1><p>Name: _________________________ Datum: ______________</p><p><b>Fortschritt:</b> ${state.solved.length} von ${allTasks.length} Aufgaben geprüft.</p>${chapters.map(c=>`<div class="report-item"><b>${c.title}:</b> ${c.tasks.filter(t=>state.solved.includes(t.id)).length} / ${c.tasks.length} Aufgaben.</div>`).join('')}<p><b>Abschlusscheck:</b> ${LESSON.final.filter(t=>state.solved.includes(t.id)).length} / 4 Aufgaben.</p><h2>Meine Erklärung</h2><p style="white-space:pre-wrap">${esc(state.reflection)||'Noch keine Erklärung notiert.'}</p><h2>Meine offene Frage</h2><p style="white-space:pre-wrap">${esc(state.notes)||'Noch keine Frage notiert.'}</p><h2>Meine Einschätzung</h2><p>${esc(state.confidence)||'Noch keine Einschätzung gewählt.'}</p><p class="muted">Richtig bearbeitete Aufgaben zeigen den Arbeitsstand. Die eigene Erklärung und das Unterrichtsgespräch zeigen, wie sicher die Begriffe verstanden wurden.</p></section>`);}
function teacher(){dialog('Für die Lehrkraft',`<p class="note">Dieser Bereich enthält Lösungen und ist frei zugänglich.</p><p>${allTasks.length} digitale Aufgaben in vier Räumen mit Abschlusscheck sowie ein zweiseitiges Arbeitsblatt. Die fachliche Einführung erfolgt durch die Lehrkraft.</p><p>Inhaltlich angelehnt an Lambacher Schweizer 9, Bayern, Kapitel II.1, S. 36–37. Die Übungen sind eigenständig.</p><h3>Lösungen der digitalen Aufgaben</h3>${[...chapters,{title:'Abschlusscheck',tasks:LESSON.final}].map(c=>`<details><summary>${c.title}</summary>${c.tasks.map(t=>`<p><b>${t.id.toUpperCase()}</b> ${math(t.solution)}</p>`).join('')}</details>`).join('')}<h3>Lösungen zum Arbeitsblatt</h3><ol><li>f und h sind quadratisch, g ist linear.</li><li>(a; b; c): (2; −4; 7), (−1; 0; 6), (0,5; 3; 0), (1; −5; 2).</li><li>${math('f(x) = −2x² + 3x')}.</li><li>${math('2x² + x − 6 = 0')}. Die Funktion ordnet jedem x einen Wert zu. Die Gleichung fragt, bei welchen x der Term 0 wird.</li><li>A: S(1 | −2), tiefster Punkt. B: S(−1 | 3), höchster Punkt.</li><li>Funktionswerte: 9; 4; 1; 0; 1; 4; 9. Nach oben geöffnet, S(0 | 0), symmetrisch zur y-Achse.</li><li>${math('f(−2) = (−2)² = (−2) · (−2) = 4')}. Die eingesetzte negative Zahl wird als Ganzes quadriert.</li><li>Quadratische Funktion: Zuordnung durch ${math('ax² + bx + c')}, a ≠ 0. Parabel: ihr Graph. Scheitelpunkt: höchster oder tiefster Punkt. Normalparabel: Graph von ${math('f(x) = x²')}.</li></ol><p class="small">Die HTML-Datei enthält die Aufgaben und die zugehörigen Abbildungen. Für die Nutzung ist keine Internetverbindung erforderlich. Fortschritt und Notizen werden ausschließlich lokal gespeichert.</p>`);}
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.dataset.go){e.preventDefault();navigate(b.dataset.go);}else if(b.id==='home'){e.preventDefault();navigate('intro');}else if(b.id==='close-dialog')$('#dialog').close();else if(b.id==='teacher')teacher();else if(b.id==='worksheet'||b.dataset.action==='worksheet')worksheet();else if(b.id==='save-report'||b.dataset.action==='report')report();else if(b.id==='reset')dialog('Neu beginnen?',`<p>Damit werden nur Fortschritt und Notizen dieses Lernspiels auf diesem Gerät zurückgesetzt. Du kannst dein Lernprotokoll vorher sichern.</p><div class="actions"><button data-action="report">Lernprotokoll drucken</button><button data-action="confirm-reset" class="primary">Neu beginnen</button></div>`);else if(b.dataset.action==='confirm-reset'){state=fresh();$('#dialog').close();render();window.scrollTo({top:0});}});
document.addEventListener('submit',e=>{const form=e.target.closest('form[data-task]');if(!form)return;e.preventDefault();const t=allTasks.find(t=>t.id===form.dataset.task),i=chapters.findIndex(c=>c.tasks.includes(t));if((i>=0&&!unlocked(i))||(i<0&&!allDone()))return;const v=readTask(t,form);state.drafts[t.id]=v;if(checkAnswer(t,v)){if(!state.solved.includes(t.id))state.solved.push(t.id);form.outerHTML=taskHTML(t);document.querySelectorAll('.progress').forEach(el=>el.outerHTML=progress());if(i>=0){$('#unlock').innerHTML=unlockHTML(chapters[i]);$('.side').outerHTML=side();}else $('#completion').innerHTML=completion();}else form.querySelector('.feedback').textContent=t.type==='numbers'&&v.some(x=>parseNumber(x)===null)?'Trage in jedes Feld eine Zahl ein. Komma, Dezimalpunkt und einfache Brüche sind möglich.':'Das passt noch nicht. Prüfe die Vorzeichen und lies die Aufgabe noch einmal. Der Hinweis hilft dir beim nächsten Schritt.';save();});
document.addEventListener('input',e=>{const el=e.target;if(['notes','reflection'].includes(el.id)){state[el.id]=el.value;save();}else{const f=el.closest('form[data-task]');if(f){const t=allTasks.find(t=>t.id===f.dataset.task);state.drafts[t.id]=readTask(t,f);save();}}});
document.addEventListener('change',e=>{if(e.target.id==='confidence'){state.confidence=e.target.value;save();}});
render();
</script></body></html>
